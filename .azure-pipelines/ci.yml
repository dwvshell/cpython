# 2. FILE AND LOGGING UTILITIES
# =================================================================----------
def utc_now() -> str:
    return datetime.now(timezone.utc).isoformat()

def read_json(path: Path, default: Any) -> Any:
    if not path.exists():
        return default
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except json.JSONDecodeError:
        return default

def write_json(path: Path, value: Any) -> None:
    tmp = path.with_suffix(".tmp")
    tmp.write_text(json.dumps(value, indent=4, ensure_ascii=False, sort_keys=True), encoding="utf-8")
    os.replace(tmp, path)

def log_audit(action: str, target_id: str, status: str, details: Optional[Dict[str, Any]] = None) -> None:
    record = {
        "audit_id": f"AUD-{uuid.uuid4().hex[:12].upper()}",
        "timestamp": utc_now(),
        "action": action,
        "target_id": target_id,
        "status": status,
        "details": details or {}
    }
    records = read_json(AUDIT_DB, [])
    records.append(record)
    write_json(AUDIT_DB, records)

